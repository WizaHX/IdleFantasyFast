name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > ~/.android/defide-release.jks

      - name: Build release APK
        env:
          DEFIDE_STORE_PASSWORD: ${{ secrets.DEFIDE_STORE_PASSWORD }}
          DEFIDE_KEY_PASSWORD: ${{ secrets.DEFIDE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed 's/.*versionName = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/IdleFantasy-v${{ steps.version.outputs.version }}.apk"

          gh release create "v${{ steps.version.outputs.version }}" \
            "$APK" \
            --title "IdleFantasy v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
            
